name: Windows compile check

'on':
  workflow_dispatch:

jobs:
  build:
    name: Windows cargo check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # 这是手动触发的检查工作流，不是 release，所以可以用缓存加速迭代。
      # release.yml 里的 "No build cache" 约束不适用于这里。
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check

      - name: Verify MSVC & Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          } else {
            Write-Host "vswhere not found, but windows-latest usually includes MSVC."
          }

      # 先做类型检查，失败会在这里就停，比完整 build 快很多。
      - name: cargo check
        run: cargo check --workspace --all-targets

      # check 通过后再做完整链接，确认能产出可执行文件。
      - name: cargo build --release
        run: cargo build --release --workspace

      # 明确断言 exe 存在，避免 upload-artifact 静默跳过。
      - name: Locate the binary
        shell: pwsh
        run: |
          $exe = "target/release/kuzgun.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "$exe not found"
            Get-ChildItem target/release -Filter *.exe -ErrorAction SilentlyContinue | Select-Object Name, Length
            exit 1
          }
          Get-ChildItem target/release -Filter *.exe | Select-Object Name, Length

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: kuzgun-windows
          path: target/release/kuzgun.exe
          if-no-files-found: error
          retention-days: 14
